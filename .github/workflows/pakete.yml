name: Pakete (GitHub Packages)

# Rosenweg: veroeffentlicht alle Module nach GitHub Packages (Maven), damit die Rosenweg-Apps
# sie ohne publishToMavenLocal bekommen:
#   org.fossify:commons (Version = Tag ohne "v", z.B. v7.1.3-rosenweg.2 -> 7.1.3-rosenweg.2)
#   ch.rosenweg4303:cloud, :anmeldeschirm, :updater (Versionen aus ihren build.gradle.kts)
# Eine schon vorhandene Version laesst GitHub Packages nicht ueberschreiben (409): dann wird das
# Modul uebersprungen - Versionen in den build.gradle.kts hochzaehlen, wenn sich etwas aendert.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Runner-Wahl (Rosenweg/rosenweg-basis, runner-wahl.yml): privat immer eigene,
  # oeffentlich eigene wenn frei oder zuschaltbar, Forks nie. macOS bleibt bei GitHub.
  wahl:
    uses: Rosenweg/rosenweg-basis/.github/workflows/runner-wahl.yml@main
    secrets:
      PAKETE_APP_ID: ${{ secrets.PAKETE_APP_ID }}
      PAKETE_APP_KEY: ${{ secrets.PAKETE_APP_KEY }}

  veroeffentlichen:
    runs-on: ${{ fromJSON(needs.wahl.outputs.linux) }}
    needs: wahl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Module veroeffentlichen
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          V="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || V="0.0.0-test"
          fehler=0
          for m in commons anmeldeschirm updater cloud; do
            [ -d "$m" ] || continue
            echo "::group::$m"
            if ./gradlew --no-daemon -PVERSION="$V" ":$m:publishReleasePublicationToGitHubPackagesRepository" 2>&1 | tee "log-$m.txt"; then
              echo "$m veroeffentlicht"
            elif grep -q "409" "log-$m.txt"; then
              echo "::notice::$m: diese Version gibt es schon (409), uebersprungen"
            else
              echo "::error::$m: Veroeffentlichen fehlgeschlagen"; fehler=1
            fi
            echo "::endgroup::"
          done
          exit $fehler
